[project]
name = "gpu-saas-control"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "pyjwt[crypto]==2.10.1",
  "psycopg[binary]==3.2.9",
  "redis==6.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pyyaml==6.0.2"]

[tool.setuptools.packages.find]
include = ["app*"]
