name: gpu-saas-local

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: gpu_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DOCKER_DATA_ROOT:-E:/DockerData/gpu-saas}/postgres:/var/lib/postgresql/data
      - ./saas_control/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpu_saas"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DOCKER_DATA_ROOT:-E:/DockerData/gpu-saas}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: saas_control/Dockerfile
    environment: &control_environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/gpu_saas
      REDIS_URL: redis://redis:6379/0
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:?set LOCAL_JWT_SECRET in .env}
      LOCAL_DEV_EMAIL: ${LOCAL_DEV_EMAIL:-student@example.com}
      LOCAL_DEV_PASSWORD: ${LOCAL_DEV_PASSWORD:?set LOCAL_DEV_PASSWORD in .env}
      LOCAL_DEV_USER_ID: 33333333-3333-3333-3333-333333333333
      DATA_ROOT: /data
    volumes:
      - ${DOCKER_DATA_ROOT:-E:/DockerData/gpu-saas}:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: saas_control/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "saas_control.app.worker"]
    environment: *control_environment
    volumes:
      - ${DOCKER_DATA_ROOT:-E:/DockerData/gpu-saas}:/data
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; assert Redis.from_url(os.environ['REDIS_URL']).get('gpu:worker:heartbeat')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
